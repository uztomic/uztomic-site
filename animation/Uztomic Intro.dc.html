<x-dc>

<script>window.OM_SCENES = '[{"name":"Nol","dur":1.8,"desc":"Qorong\u2019ulikdan brend foni ochiladi va markazda nur chizig\u2019i tug\u2019iladi"},{"name":"Qurilish","dur":3.2,"desc":"\u201cU\u201d belgisi bir chizgida chiziladi, keyin ikki plastina joyiga urilib tushadi"},{"name":"Orbita","dur":2.4,"desc":"Orbita halqasi aylanib chiziladi, ikki nuqta u bo\u2019ylab harakatlanadi"},{"name":"Nom","dur":2.6,"desc":"UZTOMIC harflari birma-bir yig\u2019iladi, tagline harflari yoyilib ochiladi"},{"name":"Kirish","dur":3.0,"desc":"Logotip yuqoriga ko\u2019tariladi va \u201cWebsitega kirish\u201d tugmasi porlaydi"}]';</script>

</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5b7cfa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#5b7cfa&quot;,&quot;#22d3ee&quot;,&quot;#a78bfa&quot;,&quot;#ffffff&quot;]},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Websitega kirish&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motionEditor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {

    return {
      accentColor: this.props.accentColor ?? '#5b7cfa',

</script>
